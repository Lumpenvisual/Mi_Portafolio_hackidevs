    <!-- Fonts: load non-render-blocking (discovered early in <head>, fetched in
         parallel) instead of an @import in CSS that chains behind the stylesheet
         and delays the hero text (LCP). display=swap keeps text visible. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      />
    </noscript>
    <!-- Prevent dark/light mode flash before React hydrates -->
    <script>
      (function () {
        try {
          var d = document.documentElement
          var t = localStorage.getItem('theme')
          if (t === 'dark' || t === 'light') { d.dataset.theme = t }
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) { d.dataset.theme = 'dark' }
          var l = localStorage.getItem('lang')
          if (l === 'es' || l === 'en') d.lang = l
        } catch (e) {}
      })()
    </script>
