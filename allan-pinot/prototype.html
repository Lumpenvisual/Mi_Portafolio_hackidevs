<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allan Pinot — Creative Developer (Web & Real-time 3D)</title>

  <!--
    PHASE 1 — Standalone Hero particle field (Allan Pinot clone).
    No build step, no framework: a single self-contained file that opens
    directly via file:// in Chrome and Firefox.

    Three.js is pulled from a CDN through an importmap (three@0.160). The
    bare specifier "three" then resolves in the module script below, exactly
    as it would after an `npm install` — so this code ports cleanly to the
    R3F version in later phases.
  -->

  <!-- Inter font (Hero typography). Loaded from Google Fonts CDN. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      /* Cinematic black background. The canvas sits behind real HTML text. */
      --bg: #000000;
      --fg: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      /* Avoid the blue tap-highlight flash on mobile. */
      -webkit-tap-highlight-color: transparent;
    }

    /*
      The WebGL canvas is decorative only. The accessible content lives in
      the .hero overlay as real HTML text, so the canvas is aria-hidden and
      removed from the tab order. Screen readers ignore it entirely.
    */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    /* Hero overlay: real, selectable, accessible HTML on top of the canvas. */
    .hero {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1.5rem;
      /* Let the mouse reach the canvas for parallax while keeping text
         selectable: the wrapper ignores pointer events, children re-enable. */
      pointer-events: none;
    }

    .hero__title {
      font-weight: 800;
      font-size: clamp(2.75rem, 11vw, 9rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      /* Subtle glow so the white title reads against the bright particles. */
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.85);
      pointer-events: auto;
    }

    .hero__subtitle {
      margin-top: 1.25rem;
      font-weight: 300;
      font-size: clamp(0.95rem, 2.2vw, 1.5rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 1px 24px rgba(0, 0, 0, 0.9);
      pointer-events: auto;
    }

    /* Entrance animation, gated behind prefers-reduced-motion below. */
    .hero__title,
    .hero__subtitle {
      opacity: 0;
      transform: translateY(18px);
      animation: rise 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .hero__subtitle { animation-delay: 0.25s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /*
      Accessibility: respect prefers-reduced-motion. We disable the CSS
      entrance here; the JS scene independently checks the same media query
      and renders a single static frame (no animation loop).
    */
    @media (prefers-reduced-motion: reduce) {
      .hero__title,
      .hero__subtitle {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    /* Graceful message if WebGL is unavailable. */
    .webgl-error {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.7);
      background: #000;
    }
  </style>
</head>
<body>
  <!-- Decorative WebGL layer. Real content is the .hero overlay below. -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <main class="hero">
    <h1 class="hero__title">Allan Pinot</h1>
    <p class="hero__subtitle">Creative Developer (Web &amp; Real-time 3D)</p>
  </main>

  <div class="webgl-error" id="webgl-error">
    <p>Your browser doesn&rsquo;t support WebGL, so the 3D background can&rsquo;t render.</p>
  </div>

  <!--
    Importmap: lets us write `import * as THREE from 'three'` with a bare
    specifier in the module below, resolving to the pinned CDN build.
    Supported natively by Chrome 89+ and Firefox 108+.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    // Post-processing for the cinematic glow. UnrealBloomPass is the single
    // biggest contributor to the dense, luminous look of allanpinot.fr —
    // it blooms the bright additive cores (stars + colour orbs) into halos.
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    /* ====================================================================
       CONFIG — tweak the entire look from here.
       ==================================================================== */
    const CONFIG = {
      // --- Particle field ---------------------------------------------------
      // Dense, compact star cloud. The luminosity comes from additive
      // accumulation + bloom, NOT from large point sprites — so the count is
      // high, the shell is small/tight, and each point is SMALL.
      PARTICLE_COUNT: 6000,      // dense field (desktop cap per project spec)
      SPHERE_RADIUS: 6,          // tighter shell -> compact, denser-looking cloud
      RADIUS_JITTER: 1.5,        // thin shell so points pile up visually
      PARTICLE_SIZE: 13,         // SMALL points; brightness comes from bloom
      SIZE_VARIANCE: 0.7,        // 0..1 random size spread per particle

      // --- Colors -----------------------------------------------------------
      // Stars are near-white / faintly blue (matches the real starfield, which
      // is white-only). The PURPLE/BLUE colour of the scene lives in the
      // nebula backdrop and the glowing orbs below — not in the stars.
      COLOR_A: 0xbcd2ff,         // faint cool blue-white
      COLOR_B: 0xe8f0ff,         // brighter blue-white
      COLOR_C: 0xffffff,         // pure white cores
      COLOR_WHITE_RATIO: 0.30,   // ~30% forced to bright white cores

      // --- Motion -----------------------------------------------------------
      AUTO_ROTATE_SPEED: 0.030,  // constant idle rotation (rad/sec)
      MOUSE_INFLUENCE: 0.35,     // how strongly the mouse tilts the field
      MOUSE_DAMPING: 0.05,       // easing toward the mouse target (0..1)
      CAMERA_BREATH_AMP: 0.45,   // camera dolly amplitude ("breathing")
      CAMERA_BREATH_SPEED: 0.4,  // camera breathing frequency

      // --- Scene ------------------------------------------------------------
      CAMERA_DISTANCE: 14,       // base camera Z (closer -> fills frame)
      FOG_NEAR: 10,
      FOG_FAR: 28,
      BACKGROUND: 0x000000,
      PIXEL_RATIO_CAP: 2,        // min(devicePixelRatio, this)

      // --- Nebula backdrop (procedural, additive) ---------------------------
      // Large, very faint radial-gradient planes drawn on a 2D canvas (no
      // external image assets -> keeps the file fully self-contained). They
      // sit far behind the stars, blend additively, and drift slowly. This is
      // where most of the soft purple/blue "fog of colour" comes from.
      NEBULA_OPACITY: 0.16,      // master opacity multiplier (kept FAINT)
      NEBULA_PURPLE: '#4a2c9c',  // muted purple cloud (low saturation)
      NEBULA_BLUE: '#143a8c',    // muted deep blue cloud

      // --- Colour orbs (glowing focal suns) ---------------------------------
      // 2-3 soft glowing sprites that carry the scene's saturated colour.
      // They float slowly and bloom strongly. Stars stay white; orbs are
      // the coloured light sources.
      ORB_GLOW_STRENGTH: 0.55,   // orb opacity; small + few so colour stays local

      // --- Bloom (UnrealBloomPass) ------------------------------------------
      // Tuned SUBTLE so it densifies/glows the canvas without blowing out.
      // Bloom is applied ONLY to the WebGL canvas; the Hero HTML text sits in
      // a separate DOM layer above the canvas and is never touched by it.
      BLOOM_STRENGTH: 0.55,      // overall bloom intensity (subtle)
      BLOOM_RADIUS: 0.5,         // spread of the glow
      BLOOM_THRESHOLD: 0.18,     // only the bright cores bloom; dark stays dark
    };

    /* ====================================================================
       prefers-reduced-motion: if the user opts out of motion, we render
       exactly one static frame and skip the animation loop entirely.
       ==================================================================== */
    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    const canvas = document.getElementById('scene');

    /* ====================================================================
       Renderer
       ==================================================================== */
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance',
      });
    } catch (e) {
      // No WebGL context — show the fallback message and stop.
      document.getElementById('webgl-error').style.display = 'flex';
      console.warn('WebGL unavailable:', e);
      throw e;
    }

    // Cap pixel ratio so retina / 4K displays don't render 4x the pixels.
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.PIXEL_RATIO_CAP));
    renderer.setSize(window.innerWidth, window.innerHeight);
    // ACES Filmic tone mapping for a cinematic, filmic falloff on highlights.
    // Tone mapping + sRGB conversion is applied ONCE at the END of the
    // post-processing chain by OutputPass, which reads renderer.toneMapping.
    // We therefore set it on the renderer but let OutputPass do the actual
    // mapping (the intermediate composer targets stay in linear space, which
    // is what UnrealBloomPass expects). Exposure is trimmed slightly because
    // bloom adds extra energy and would otherwise blow out the highlights.
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    /* ====================================================================
       Scene & camera
       ==================================================================== */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.BACKGROUND);
    // Fog fades distant particles into the black background -> depth + mood.
    scene.fog = new THREE.Fog(CONFIG.BACKGROUND, CONFIG.FOG_NEAR, CONFIG.FOG_FAR);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, CONFIG.CAMERA_DISTANCE);

    /* ====================================================================
       Particle geometry — spherical distribution.

       We build three packed attributes:
         - position: points on a jittered spherical shell
         - aColor:   per-particle RGB (purple/blue/white mix)
         - aSize:    per-particle size multiplier (variance)

       Using a single BufferGeometry + Points draw call keeps this to ONE
       draw call for all 2000 particles (no per-particle objects).
       ==================================================================== */
    const count = CONFIG.PARTICLE_COUNT;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);

    const cA = new THREE.Color(CONFIG.COLOR_A);
    const cB = new THREE.Color(CONFIG.COLOR_B);
    const cC = new THREE.Color(CONFIG.COLOR_C);
    const tmp = new THREE.Color();

    for (let i = 0; i < count; i++) {
      // Uniform point on a sphere via the inverse-CDF method (avoids the
      // pole-clustering you'd get from naive lat/long sampling).
      const u = Math.random();
      const v = Math.random();
      const theta = 2 * Math.PI * u;          // azimuth
      const phi = Math.acos(2 * v - 1);        // polar, uniform on sphere
      const r =
        CONFIG.SPHERE_RADIUS + (Math.random() - 0.5) * 2 * CONFIG.RADIUS_JITTER;

      const sinPhi = Math.sin(phi);
      positions[i * 3 + 0] = r * sinPhi * Math.cos(theta);
      positions[i * 3 + 1] = r * sinPhi * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);

      // Color: blend purple<->blue by a random t, then occasionally force
      // a near-white highlight so the field sparkles.
      if (Math.random() < CONFIG.COLOR_WHITE_RATIO) {
        tmp.copy(cC);
      } else {
        tmp.copy(cA).lerp(cB, Math.random());
      }
      colors[i * 3 + 0] = tmp.r;
      colors[i * 3 + 1] = tmp.g;
      colors[i * 3 + 2] = tmp.b;

      // Size multiplier: 1 +/- variance.
      sizes[i] = 1 - CONFIG.SIZE_VARIANCE + Math.random() * CONFIG.SIZE_VARIANCE * 2;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

    /* ====================================================================
       Custom ShaderMaterial.

       Vertex shader:
         - sizes each point in *perspective* (size attenuates with distance,
           the gl_PointSize / -mvPosition.z trick) and applies the per-particle
           size attribute and a fog factor passed to the fragment shader.

       Fragment shader:
         - turns the square gl_PointCoord quad into a soft CIRCULAR glow via a
           radial falloff, discarding the corners. Additive blending then makes
           overlapping particles bloom into bright cores — the "glow" look.
       ==================================================================== */
    const material = new THREE.ShaderMaterial({
      uniforms: {
        uSize: { value: CONFIG.PARTICLE_SIZE * renderer.getPixelRatio() },
        // Pass fog params as uniforms so the point shader can fade with depth.
        uFogColor: { value: new THREE.Color(CONFIG.BACKGROUND) },
        uFogNear: { value: CONFIG.FOG_NEAR },
        uFogFar: { value: CONFIG.FOG_FAR },
      },
      vertexShader: /* glsl */ `
        attribute vec3 aColor;
        attribute float aSize;

        varying vec3 vColor;
        varying float vFogDepth;

        uniform float uSize;

        void main() {
          vColor = aColor;

          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          // Perspective size attenuation: closer points are larger.
          gl_PointSize = uSize * aSize * (1.0 / -mvPosition.z);
          // Linear view-space depth, fed to the fragment for fog.
          vFogDepth = -mvPosition.z;

          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: /* glsl */ `
        precision mediump float;

        varying vec3 vColor;
        varying float vFogDepth;

        uniform vec3 uFogColor;
        uniform float uFogNear;
        uniform float uFogFar;

        void main() {
          // Distance from the center of the point sprite (0 center -> ~0.7 corner).
          float d = distance(gl_PointCoord, vec2(0.5));

          // Round the sprite; discard the corners.
          if (d > 0.5) discard;

          // Two-component glow: a WIDE soft halo plus a tight, very bright
          // CORE. Summing them (and letting additive blending stack
          // overlapping sprites) is what the bloom pass then amplifies into
          // the dense, luminous starfield look.
          float halo = smoothstep(0.5, 0.0, d);   // broad falloff
          float core = pow(halo, 3.0);            // tight bright centre
          float intensity = core + halo * 0.4;    // bright core + faint halo

          // Apply linear fog: distant particles fade toward the background.
          float fogFactor = smoothstep(uFogNear, uFogFar, vFogDepth);
          vec3 color = mix(vColor, uFogColor, fogFactor);

          gl_FragColor = vec4(color, intensity * (1.0 - fogFactor));
        }
      `,
      transparent: true,
      // Additive blending: overlapping glows sum -> bright, bloom-like cores.
      blending: THREE.AdditiveBlending,
      // No depth write so additive particles don't occlude each other.
      depthWrite: false,
      depthTest: true,
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    /* ====================================================================
       Nebula backdrop — procedural additive colour planes.

       A radial-gradient texture is painted onto an offscreen 2D canvas (so
       NO external image asset is needed — the file stays self-contained).
       Two large planes are placed far behind the star field, blended
       additively, and slowly counter-rotated. They supply the soft purple /
       blue "fog of colour" that the white stars sit inside.

       We keep their geometry simple (one PlaneGeometry shared) and dispose
       textures on unload alongside everything else.
       ==================================================================== */
    function makeNebulaTexture(hexColor) {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      // Transparent base so additive blending only adds the coloured falloff.
      ctx.clearRect(0, 0, size, size);
      const g = ctx.createRadialGradient(
        size / 2, size / 2, 0,
        size / 2, size / 2, size / 2
      );
      // Soft, low-alpha falloff -> a diffuse cloud, not a hard disc.
      g.addColorStop(0.0, hexColor);
      g.addColorStop(0.35, hexColor);
      g.addColorStop(1.0, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.fill();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const nebulaGeo = new THREE.PlaneGeometry(34, 34);
    const nebulaTextures = [];
    const nebulaMaterials = [];
    const nebulaMeshes = [];

    function addNebula(hexColor, x, y, z, scale, rotation) {
      const tex = makeNebulaTexture(hexColor);
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,           // always behind; never occludes stars
        opacity: CONFIG.NEBULA_OPACITY,
        fog: false,                 // nebula is a backdrop, not fogged
      });
      const mesh = new THREE.Mesh(nebulaGeo, mat);
      mesh.position.set(x, y, z);
      mesh.scale.setScalar(scale);
      mesh.rotation.z = rotation;
      mesh.renderOrder = -1;        // draw before the stars
      scene.add(mesh);
      nebulaTextures.push(tex);
      nebulaMaterials.push(mat);
      nebulaMeshes.push(mesh);
    }

    // Purple cloud upper-left, blue cloud lower-right -> a colour gradient
    // across the frame behind the stars.
    addNebula(CONFIG.NEBULA_PURPLE, -8, 6, -20, 1.0, 0.4);
    addNebula(CONFIG.NEBULA_BLUE, 9, -6, -22, 1.1, -0.6);

    /* ====================================================================
       Glowing colour orbs — soft focal "suns".

       Sprite-based glows (same procedural radial texture, brighter tint)
       that carry the scene's saturated colour and bloom strongly. The stars
       stay white; these orbs are the coloured light sources. Using sprites
       (camera-facing quads) keeps them cheap and always round.
       ==================================================================== */
    function makeOrbTexture(hexColor) {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(
        size / 2, size / 2, 0,
        size / 2, size / 2, size / 2
      );
      // Hot white-ish core -> coloured mid -> transparent edge, so the orb
      // has a bloom-friendly bright centre.
      g.addColorStop(0.0, '#ffffff');
      g.addColorStop(0.15, hexColor);
      g.addColorStop(0.5, hexColor);
      g.addColorStop(1.0, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const orbTextures = [];
    const orbMaterials = [];
    const orbs = [];

    function addOrb(hexColor, x, y, z, scale) {
      const tex = makeOrbTexture(hexColor);
      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,
        opacity: CONFIG.ORB_GLOW_STRENGTH,
        fog: false,
      });
      const sprite = new THREE.Sprite(mat);
      sprite.position.set(x, y, z);
      sprite.scale.setScalar(scale);
      // Store base position so we can float around it without drifting away.
      sprite.userData.base = new THREE.Vector3(x, y, z);
      sprite.userData.phase = Math.random() * Math.PI * 2;
      scene.add(sprite);
      orbTextures.push(tex);
      orbMaterials.push(mat);
      orbs.push(sprite);
    }

    // Brighter saturated tints for the orbs (they're the colour sources).
    addOrb('#7a4cff', -7, 3.5, -9, 2.8);
    addOrb('#2f6bff', 8, -3, -11, 3.2);
    addOrb('#9a6cff', 2, 6, -13, 2.2);

    /* ====================================================================
       Post-processing: EffectComposer with a subtle UnrealBloomPass.

       Pipeline: RenderPass -> UnrealBloomPass -> OutputPass.
       The OutputPass applies tone mapping + colour-space conversion at the
       end of the chain (so we keep the renderer's tone mapping but apply it
       once, after bloom). Bloom only affects the WebGL canvas — the Hero
       HTML text is a separate DOM layer above the canvas, untouched.
       ==================================================================== */
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(renderer.getPixelRatio());
    composer.setSize(window.innerWidth, window.innerHeight);

    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      CONFIG.BLOOM_STRENGTH,
      CONFIG.BLOOM_RADIUS,
      CONFIG.BLOOM_THRESHOLD
    );
    composer.addPass(bloomPass);

    // OutputPass handles tone mapping + sRGB at the end of the chain.
    composer.addPass(new OutputPass());

    /* ====================================================================
       Mouse parallax state (pointer events on the canvas, behind the text).
       ==================================================================== */
    const mouse = { x: 0, y: 0 };       // normalized -1..1 target
    const tilt = { x: 0, y: 0 };        // eased current value

    function onPointerMove(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
    }
    if (!reduceMotion) {
      window.addEventListener('pointermove', onPointerMove, { passive: true });
    }

    /* ====================================================================
       Resize handling — keep aspect, size, and pixel-ratio-scaled point
       size correct on viewport changes.
       ==================================================================== */
    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.PIXEL_RATIO_CAP));
      renderer.setSize(w, h);
      // The composer owns the final render target chain, so it must be
      // resized (and kept at the same capped pixel ratio) alongside the
      // renderer, or bloom will sample a stale-sized buffer.
      composer.setPixelRatio(renderer.getPixelRatio());
      composer.setSize(w, h);
      // gl_PointSize is in device pixels, so rescale with the (capped) ratio.
      material.uniforms.uSize.value = CONFIG.PARTICLE_SIZE * renderer.getPixelRatio();
    }
    window.addEventListener('resize', onResize);

    /* ====================================================================
       Render / animation loop.
       ==================================================================== */
    const clock = new THREE.Clock();
    let elapsed = 0; // accumulated time (sum of deltas) for camera breathing

    function renderFrame() {
      // Read delta FIRST: clock.getDelta() advances the clock's internal
      // oldTime, so calling getElapsedTime() before it would leave delta ~0
      // every frame and freeze the rotation. Track elapsed ourselves instead.
      const dt = clock.getDelta();
      elapsed += dt;

      // Constant idle rotation around Y, plus a slow X drift for life.
      points.rotation.y += CONFIG.AUTO_ROTATE_SPEED * dt;
      points.rotation.x += CONFIG.AUTO_ROTATE_SPEED * 0.4 * dt;

      // Ease the field's tilt toward the mouse target (damped, no jitter).
      tilt.x += (mouse.y * CONFIG.MOUSE_INFLUENCE - tilt.x) * CONFIG.MOUSE_DAMPING;
      tilt.y += (mouse.x * CONFIG.MOUSE_INFLUENCE - tilt.y) * CONFIG.MOUSE_DAMPING;
      points.rotation.x += tilt.x * dt; // additive nudge on top of idle spin
      points.rotation.z = -tilt.y * 0.3;

      // Slow counter-rotation of the nebula planes for a living backdrop.
      if (nebulaMeshes[0]) nebulaMeshes[0].rotation.z += 0.01 * dt;
      if (nebulaMeshes[1]) nebulaMeshes[1].rotation.z -= 0.008 * dt;

      // Orbs float gently around their base position (Lissajous-ish drift).
      for (let i = 0; i < orbs.length; i++) {
        const o = orbs[i];
        const b = o.userData.base;
        const p = o.userData.phase;
        o.position.x = b.x + Math.sin(elapsed * 0.25 + p) * 0.6;
        o.position.y = b.y + Math.cos(elapsed * 0.2 + p) * 0.5;
      }

      // Gentle camera "breathing": a slow sinusoidal dolly in/out.
      camera.position.z =
        CONFIG.CAMERA_DISTANCE +
        Math.sin(elapsed * CONFIG.CAMERA_BREATH_SPEED) * CONFIG.CAMERA_BREATH_AMP;
      // Slight look-around toward the mouse for added parallax.
      camera.position.x += (tilt.y * 2 - camera.position.x) * 0.05;
      camera.position.y += (-tilt.x * 2 - camera.position.y) * 0.05;
      camera.lookAt(scene.position);

      // Render through the composer so bloom is applied to the canvas.
      composer.render();
    }

    function animate() {
      renderFrame();
      requestAnimationFrame(animate);
    }

    if (reduceMotion) {
      // Static, motion-free render: one frame, looking straight on.
      // Still routed through the composer so the bloom/glow look is present
      // in the static image (bloom is a visual style, not motion).
      camera.position.set(0, 0, CONFIG.CAMERA_DISTANCE);
      camera.lookAt(scene.position);
      composer.render();
    } else {
      animate();
    }

    /* ====================================================================
       Cleanup on unload — dispose GPU resources. (In the single-page demo
       this mainly matters for hot reloads / repeated navigation.)
       ==================================================================== */
    window.addEventListener('beforeunload', () => {
      geometry.dispose();
      material.dispose();
      // Nebula backdrop resources.
      nebulaGeo.dispose();
      nebulaTextures.forEach((t) => t.dispose());
      nebulaMaterials.forEach((m) => m.dispose());
      // Orb resources.
      orbTextures.forEach((t) => t.dispose());
      orbMaterials.forEach((m) => m.dispose());
      // Post-processing render targets + the renderer.
      composer.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
